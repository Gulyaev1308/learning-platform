name: Deploy Learning Platform

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Deploy to Cloud.ru via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: admin
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Заходим в папку проекта или создаем её
          mkdir -p ~/learning-platform
          cd ~/learning-platform
          
          # 2. Полностью и принудительно очищаем всё содержимое папки
          sudo rm -rf ./* ./.* 2>/dev/null || true
          
          # 3. Хитрый обход бага парсера: собираем URL из частей через переменные
          DOMAIN="github.com"
          REPO_PATH="Gulyaev1308/learning-platform.git"
          FULL_URL="https://${DOMAIN}/${REPO_PATH}"
          
          # Клонируем проект по склеенной ссылке
          git clone "$FULL_URL" .
          
          # 4. Создаем файл конфигурации .env на сервере (ИСПРАВЛЕНО: везде >>)
          echo "DB_USER=learning_admin" > .env
          echo "DB_NAME=learning_platform_db" >> .env
          echo "DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}" >> .env
          echo "SESSION_SECRET=${{ secrets.PRODUCTION_SESSION_SECRET }}" >> .env

          # Создаем файлы окружения приложения
          echo "DATABASE_URL=postgresql://learning_admin:${{ secrets.PRODUCTION_DB_PASSWORD }}@postgres-db:5432/learning_platform_db?schema=public" > .env.production
          echo "SESSION_SECRET=${{ secrets.PRODUCTION_SESSION_SECRET }}" >> .env.production

          echo "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> .env
          echo "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" >> .env
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env
          echo "S3_ENDPOINT=https://s3.cloud.ru" >> .env
          
          # 5. Пересобираем и запускаем Docker-контейнеры приложения и Postgres
          sudo docker compose up -d --build
