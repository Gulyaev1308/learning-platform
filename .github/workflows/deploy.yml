name: Deploy Learning Platform

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Deploy to Cloud.ru via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: admin
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Создаем рабочую директорию проекта, если её нет
          mkdir -p ~/learning-platform
          cd ~/learning-platform
          
          # Полностью очищаем папку от старых сломанных попыток деплоя
          rm -rf .git
          
          # Клонируем репозиторий. URL обернут в кавычки для защиты синтаксиса Linux
          git clone 'https://github.com' .
          
          # Безопасно создаем файл .env прямо на сервере из секретов GitHub
          echo "DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}" > .env
          echo "SESSION_SECRET=${{ secrets.PRODUCTION_SESSION_SECRET }}" >> .env
          
          # Запускаем сборку и развертывание контейнеров (Next.js + Postgres)
          sudo docker compose up -d --build
