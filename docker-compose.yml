services:
  # 1. База данных PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: learning-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Твое Next.js приложение
  nextjs-app:
    build: .
    container_name: learning-platform-app
    ports:
      - "80:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --trace-warnings --expose-gc
    # Переменные DATABASE_URL и SESSION_SECRET приложение Next.js автоматически прочитает из файла .env.production, который создаст робот!
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    command: sh -c "node database/init.js && node server.js"

volumes:
  pg_data:
