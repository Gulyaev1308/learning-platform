version: '3.8'

services:
  # 1. База данных PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: learning-postgres
    environment:
      POSTGRES_USER: learning_admin
      POSTGRES_PASSWORD: "MesaSuperPassword2026!"
      POSTGRES_DB: learning_platform_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    # Добавляем проверку здоровья БД, чтобы Next.js не падал при старте
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_admin -d learning_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ваше Next.js приложение
  nextjs-app:
    build: .
    container_name: learning-platform-app
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: "postgresql://learning_admin:MesaSuperPassword2026!@postgres-db:5432/learning_platform_db?schema=public"
      SESSION_SECRET: "super-secret-padlock-key-for-iron-session-32"
      HOST: "0.0.0.0"
      PORT: 3000
      NODE_OPTIONS: "--trace-warnings --expose-gc"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    # Ждем, пока Postgres будет полностью ГОТОВ, а не просто запущен
    depends_on:
      postgres-db:
        condition: service_healthy
    # Выполняем миграции в изолированной оболочке перед стартом основного процесса server.js
    command: sh -c "node database/init.js && node database/update-schema.js && node database/seed.js && node server.js"
